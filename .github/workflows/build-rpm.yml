name: Run Build Tasks and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-arm64:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: read
    strategy:
      matrix:
        include:
          - tag: aarch64_el7
            el: "7"
            arch: aarch64
            artifact: rpm-el7-aarch64
          - tag: aarch64_el8
            el: "8"
            arch: aarch64
            artifact: rpm-el8-aarch64
          - tag: aarch64_el9
            el: "9"
            arch: aarch64
            artifact: rpm-el9-aarch64
          - tag: aarch64_el8
            el: "uos20"
            arch: aarch64
            uos20: "1"
            artifact: rpm-uos20-aarch64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run pullsrc.sh
        run: env ALL=1 ./pullsrc.sh

      - name: Generate version-local.env
        run: |
          TAG=${{ github.ref_name }}
          BUILD_NUM=$(echo "$TAG" | grep -oE 'b[0-9]+' | tail -1)
          if [ -z "$BUILD_NUM" ]; then
            BUILD_NUM="b1"
          fi
          echo "WITH_OPENSSL=2" > version-local.env
          echo "PKGREL=$BUILD_NUM" >> version-local.env
          cat version-local.env

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run ${{ matrix.tag }}
        run: |
          chmod +x docker/docker_compile.sh
          docker run --rm \
            -v $(pwd):/data \
            -e "UOS20=${{ matrix.uos20 }}" \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ matrix.tag }}

      - name: Upload RPM artifacts
        uses: actions/upload-artifact@v7
        with:
          name: rpm-el${{ matrix.el }}-${{ matrix.arch }}
          path: output/*.rpm
          if-no-files-found: ignore

  build-amd64:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    strategy:
      matrix:
        include:
          - tag: el9
            el: "9"
            arch: x86_64
            artifact: rpm-el9-x86_64
          - tag: el8
            el: "8"
            arch: x86_64
            artifact: rpm-el8-x86_64
          - tag: el7
            el: "7"
            arch: x86_64
            artifact: rpm-el7-x86_64
          - tag: el6
            el: "6"
            arch: x86_64
            artifact: rpm-el6-x86_64
          - tag: el8
            el: "uos20"
            arch: x86_64
            uos20: "1"
            artifact: rpm-uos20-x86_64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run pullsrc.sh
        run: ./pullsrc.sh

      - name: Generate version-local.env
        run: |
          TAG=${{ github.ref_name }}
          BUILD_NUM=$(echo "$TAG" | grep -oE 'b[0-9]+' | tail -1)
          if [ -z "$BUILD_NUM" ]; then
            BUILD_NUM="b1"
          fi
          echo "WITH_OPENSSL=2" > version-local.env
          echo "PKGREL=$BUILD_NUM" >> version-local.env
          cat version-local.env

      - name: Log in to Container Registry
        uses: docker/login-action@v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run ${{ matrix.tag }}
        run: |
          chmod +x docker/docker_compile.sh
          docker run --rm \
            -v $(pwd):/data \
            -e "UOS20=${{ matrix.uos20 }}" \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ matrix.tag }}

      - name: Upload RPM artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: output/*.rpm
          if-no-files-found: ignore

  build-el5:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    if: false
    strategy:
      matrix:
        include:
          - m32: "0"
            el: "5"
            arch: x86_64
            artifact: rpm-el5-x86_64
          - m32: "1"
            el: "5"
            arch: i686
            artifact: rpm-el5-i686

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run pullsrc.sh
        run: ./pullsrc.sh

      - name: Generate version-local.env
        run: |
          TAG=${{ github.ref_name }}
          BUILD_NUM=$(echo "$TAG" | grep -oE 'b[0-9]+' | tail -1)
          if [ -z "$BUILD_NUM" ]; then
            BUILD_NUM="b1"
          fi
          echo "WITH_OPENSSL=2" > version-local.env
          echo "PKGREL=$BUILD_NUM" >> version-local.env
          cat version-local.env

      - name: Log in to Container Registry
        uses: docker/login-action@v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run el5 with M32=${{ matrix.m32 }}
        run: |
          docker run --rm \
            -v $(pwd):/data \
            -e "M32=${{ matrix.m32 }}" \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:el5

      - name: Upload RPM artifacts
        uses: actions/upload-artifact@v7
        with:
          name: rpm-el${{ matrix.el }}-${{ matrix.arch }}
          path: output/*.rpm
          if-no-files-found: error

  release:
    needs: [build-arm64, build-amd64] # , build-el5
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: List downloaded artifacts
        run: |
          echo "Downloaded artifact directories:"
          find artifacts -mindepth 1 -maxdepth 1 -type d

      - name: Repackage artifacts and release
        id: repackage
        run: |
          source version.env
          sudo timedatectl set-timezone Asia/Shanghai
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            export build_timestamp="$(date +'%Y%m%d_%H%M')"
            TAG="OpenSSH_${OPENSSHVER}_${build_timestamp}"
            echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          else
            TAG="OpenSSH_${{ github.ref_name }}_${build_timestamp}"
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi
          mkdir -p release-assets
          for dir in artifacts/*/; do
            artifact_name=$(basename "$dir")
            new_name="openssh_${TAG}_${artifact_name}"
            echo "Packaging ${artifact_name} -> ${new_name}.zip"
            (cd "$dir" && zip -r "${GITHUB_WORKSPACE}/release-assets/${new_name}.zip" .)
          done
          echo "Release assets:"
          ls -la release-assets
          echo -e "> Automated release OpenSSH_${OPENSSHVER} with OpenSSL_${OPENSSLVER}.\n" > ${GITHUB_WORKSPACE}/RELEASE.md
          cat <<'EOF' >> ${GITHUB_WORKSPACE}/RELEASE.md
          # Proxy download:
          ```bash
          curl -#Lo openssh-indiff.zip "https://ghfast.top/https://github.com/indiff/openssh-rpms/releases/download/OpenSSH_shitver_shitstamp/openssh_el7_shitstamp.x86_64.zip" --insecure
          ```
          ```bash
          wget --no-check-certificate "https://ghfast.top/https://github.com/indiff/openssh-rpms/releases/download/OpenSSH_shitver_shitstamp/openssh_el7_shitstamp.x86_64.zip" -O openssh-indiff.zip 
          ```
            
          # Direct download:
          ```bash         
          curl -#Lo openssh-indiff.zip "https://github.com/indiff/openssh-rpms/releases/download/OpenSSH_shitver_shitstamp/openssh_el7_shitstamp.x86_64.zip"
          ```

          ```
          unzip openssh-indiff.zip -d openssh
          cd openssh

          # Backup current SSH config
          [[ -f /etc/ssh/sshd_config ]] && mv /etc/ssh/sshd_config /etc/ssh/sshd_config.$(date +%Y%m%d)

          # Install rpm packages. Exclude all debug packages.
          find . ! -name '*debug*' -name '*.rpm' | xargs sudo yum --disablerepo=* localinstall -y --allowerasing

          # fix by packages.
          yum install -y libICE libSM libX11 libXt
          yum update -y
          find . ! -name '*debug*' -name '*.rpm' | xargs sudo yum --disablerepo=* localinstall -y --skip-broken

          # install by rpm 
          yum erase openssh-askpass openssh-keycat openssh-cavs openssh-askpass openssh-askpass-gnome openssh-debuginfo
          rpm -ivh --force --nodeps --replacepkgs --replacefiles openssh-*.rpm

          # in case host key files got permissions too open.
          chmod -v 600 /etc/ssh/ssh_host_*_key

          # For CentOS7+:
          # in some cases previously installed systemd unit file is left on disk after upgrade.
          # causes systemd mixing unit files and initscripts units provided by this package.
          if [[ -d /run/systemd/system && -f /usr/lib/systemd/system/sshd.service ]]; then
              mv /usr/lib/systemd/system/sshd.service /usr/lib/systemd/system/sshd.service.$(date +%Y%m%d)
              systemctl daemon-reload
          fi

          # Check Installed version:
          ssh -V && /usr/sbin/sshd -V

          # Restart service
          service sshd restart
          ```

          ```
          cat << 'EOF' > /etc/ssh/sshd_config
          Port 22
          AddressFamily inet
          PubkeyAcceptedAlgorithms +ssh-rsa
          PermitRootLogin yes
          PasswordAuthentication yes
          UseDNS no
          UsePAM yes
          TCPKeepAlive yes
          ClientAliveInterval 60
          ClientAliveCountMax 3
          #Subsystem sftp  internal-sftp
          Subsystem sftp  /usr/libexec/openssh/sftp-server
          KexAlgorithms -diffie-hellman-group1-sha1,diffie-hellman-group1-sha256,diffie-hellman-group14-sha1,diffie-hellman-group14-sha256,diffie-hellman-group15-sha256,diffie-hellman-group15-sha512,diffie-hellman-group16-sha256,diffie-hellman-group16-sha512,diffie-hellman-group17-sha512,diffie-hellman-group18-sha512,diffie-hellman-group-exchange-sha1,diffie-hellman-group-exchange-sha256,diffie-hellman-group-exchange-sha512
          shitshit
          ```
          EOF
          sed -i "s/shitver/${OPENSSHVER}/g" RELEASE.md
          sed -i "s/shitstamp/${build_timestamp}/g" RELEASE.md
          sed -i 's/shitshit/EOF/g' RELEASE.md
          GITHUB_REF=${{ github.ref }}
          TAGNAME="OpenSSH_${OPENSSHVER}_${build_timestamp}"
          NAME="${TAGNAME}"
          git tag -l --format='%(contents)' "${TAGNAME}" | tee -a ${GITHUB_WORKSPACE}/RELEASE.md
          gh release delete --cleanup-tag --yes "$TAGNAME" || true
          gh release create "$TAGNAME" --target "main" -F ${GITHUB_WORKSPACE}/RELEASE.md --title "$NAME" ${GITHUB_WORKSPACE}/release-assets/*
        env:
          GITHUB_TOKEN: ${{ github.token }}

      # - name: Create Release
      #   uses: softprops/action-gh-release@v3
      #   with:
      #     files: release-assets/*.zip
      #     generate_release_notes: true
      #     tag_name: ${{ steps.repackage.outputs.tag }}   # ← 关键：显式指定 tag
